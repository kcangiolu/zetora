name: Feature request
description: Suggest an idea for Zetora
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: ideas
    attributes:
      label: Ideas
      description: How it could work, if you have something in mind. Alternatives you considered.
