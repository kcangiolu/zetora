use_default_settings: true

search:
  formats:
    - html
    - json

server:
  # MUST be replaced with a random value before deploying (used to sign
  # image_proxy URLs and the limiter). Generate with: openssl rand -hex 32
  secret_key: 'CHANGE_ME_openssl_rand_hex_32'
  bind_address: '0.0.0.0'
  limiter: false
  image_proxy: true

ui:
  static_use_hash: true

valkey:
  url: redis://searxng-redis:6379/0

# A query waits for its slowest engine. Brave rate-limits shared server IPs,
# DuckDuckGo serves them a CAPTCHA and Wikidata often times out: each would
# only add its timeout to every query. Bing and Yahoo answer from a server and
# widen the results beyond Google CSE.
engines:
  - name: radio browser
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: wikidata
    disabled: true
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
