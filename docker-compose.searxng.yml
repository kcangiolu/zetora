services:
  searxng:
    image: searxng/searxng:latest
    container_name: zetora-searxng
    ports:
      - '8080:8080'
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: zetora-searxng-redis
    restart: unless-stopped
