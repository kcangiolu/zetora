allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  canvas: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  sqlite3: true
  unrs-resolver: true

# Forces transitive dependencies up to their CVE-patched versions (see
# `pnpm audit --prod`). package.json's own top-level "overrides" field is
# npm-only and silently ignored by pnpm — this is the field pnpm actually
# reads (pnpm.io/settings).
overrides:
  react-is: ^19.2.7
  '@types/node': ^25.5.0
  path-to-regexp: '>=6.3.0'
  tar: '>=7.5.16'
  axios: '>=1.16.0'
  form-data: '>=4.0.6'
  hono: '>=4.12.25'
  undici: '>=8.12.2'
  sharp: '>=0.35.5'
  # One copy of each for the whole AI SDK: ai and every @ai-sdk package pin
  # these exactly, and @ai-sdk-tool/parser pins older ones.
  '@ai-sdk/provider': 3.0.19
  '@ai-sdk/provider-utils': 4.0.62
  esbuild: '>=0.28.1'
  postcss: '>=8.5.10'
  uuid: '>=11.1.1'
  # @vectorstores/readers asks for ^5; 6 only renamed options its CSVReader
  # never passes, and 7 has no breaking change.
  csv-parse: '>=7.0.2'
  # @tailwindcss/typography pins 6.0.10 exactly; stays on the same major.
  postcss-selector-parser: ^6.1.5
  # Only reachable today through @react-email/preview-server's pinned inner
  # copy (dev-only `email:dev` script, never deployed) — deduped up to the
  # same versions the app itself already uses.
  next: '>=16.4.3'
  ws: '>=8.21.0'
