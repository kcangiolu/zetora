# Test identity provider for Zetora's single sign-on, applied by the Authentik
# worker of docker-compose.sso-test.yml. It creates the OIDC and SAML
# providers Zetora's .env points at, an admin and an auditor group, and three
# users: Ada (admin), Grace (auditor), Alan (member). Every secret comes from
# the environment, see docker-compose.sso-test.yml.
version: 1
metadata:
  name: Zetora SSO test bench
entries:
  - model: authentik_core.group
    id: zetora-admins
    identifiers:
      name: zetora-admins
  - model: authentik_core.group
    id: zetora-auditors
    identifiers:
      name: zetora-auditors

  - model: authentik_providers_oauth2.oauth2provider
    id: zetora-provider
    identifiers:
      name: zetora
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Empty unless listed when the provider comes from a blueprint.
      grant_types: [authorization_code, refresh_token]
      client_id: zetora
      client_secret: !Env SSO_TEST_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/api/auth/sso/callback/oidc
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: zetora
    attrs:
      name: Zetora
      provider: !KeyOf zetora-provider

  # The same users over SAML: SAML_ENTRY_POINT=http://localhost:9000/application/saml/zetora-saml/,
  # SAML_IDP_ENTITY_ID=zetora-test-idp, SAML_IDP_CERT from
  # http://localhost:9000/application/saml/zetora-saml/metadata/ and
  # SAML_GROUPS_ATTRIBUTE=http://schemas.xmlsoap.org/claims/Group.
  - model: authentik_providers_saml.samlprovider
    id: zetora-saml-provider
    identifiers:
      name: zetora-saml
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      acs_url: http://localhost:3000/api/auth/sso/saml2/sp/acs/saml
      audience: http://localhost:3000/api/auth/sso/saml2/sp/metadata?providerId=saml
      issuer_override: zetora-test-idp
      sp_binding: post
      signing_kp: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sign_assertion: true
      sign_response: true
      # Single logout both ways, with signed messages as Zetora requires.
      sls_url: http://localhost:3000/api/auth/sso/saml2/sp/slo/saml
      # Better Auth verifies signed logout messages only over HTTP-POST.
      sls_binding: post
      logout_method: frontchannel_native
      sign_logout_request: true
      sign_logout_response: true
      property_mappings:
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/name]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/groups]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/uid]]

  - model: authentik_core.application
    identifiers:
      slug: zetora-saml
    attrs:
      name: Zetora (SAML)
      provider: !KeyOf zetora-saml-provider

  - model: authentik_core.user
    identifiers:
      username: ada
    attrs:
      name: Ada
      email: ada@example.com
      password: !Env SSO_TEST_USER_PASSWORD
      groups:
        - !KeyOf zetora-admins
  - model: authentik_core.user
    identifiers:
      username: grace
    attrs:
      name: Grace
      email: grace@example.com
      password: !Env SSO_TEST_USER_PASSWORD
      groups:
        - !KeyOf zetora-auditors
  - model: authentik_core.user
    identifiers:
      username: alan
    attrs:
      name: Alan
      email: alan@example.com
      password: !Env SSO_TEST_USER_PASSWORD
