# =============================================================================
# Zetora — Production docker-compose
#
# Usage:
#   1. Copy .env.example to .env and fill in the required values.
#   2. Set DATA_DIR in .env (e.g. DATA_DIR=/mnt/user/appdata/zetora).
#   3. Create the required directories and files on the host:
#
#        source .env
#        mkdir -p \
#          ${DATA_DIR}/postgres \
#          ${DATA_DIR}/redis \
#          ${DATA_DIR}/bullmq-redis \
#          ${DATA_DIR}/qdrant \
#          ${DATA_DIR}/minio \
#          ${DATA_DIR}/searxng \
#          ${DATA_DIR}/falkordb \
#          ${DATA_DIR}/graphiti \
#          ${DATA_DIR}/whisper \
#          ${DATA_DIR}/qwen3-tts/huggingface \
#          ${DATA_DIR}/qwen3-tts/output \
#          ${DATA_DIR}/qwen3-tts/voices \
#          ${DATA_DIR}/qwen3-tts/prompt_cache
#        # Copy the SearXNG config into ${DATA_DIR}/searxng/settings.yml
#        # Optional: drop {voice}.wav + {voice}.lang into qwen3-tts/voices/
#
#   4. docker compose pull && docker compose up -d
#      qwen3-tts is opt-in (profile "tts") — it shares the GPU with local LLM
#      inference and is NOT started by the command above. Start it on demand:
#        docker compose --profile tts up -d qwen3-tts
#      Or set COMPOSE_PROFILES=tts in .env to keep it always resident.
#
# All services share the `zetora-network` network and resolve each other by
# service name (e.g. the app reaches Postgres at `postgres:5432`).
#
# Internal-only services (postgres, redis, minio, qdrant, searxng, sandbox,
# falkordb, graphiti, bullmq-redis, bullboard) are bound to 127.0.0.1 — put a
# reverse proxy in front of zetora.app (port 3333) for your domain, and use
# an SSH tunnel if you need direct access to an admin UI (MinIO console,
# Bullboard, SearXNG, Qdrant dashboard, FalkorDB browser).
#
# To drop an optional service (minio, qdrant, searxng, sandbox, graphiti,
# bullmq), remove its block below along with the matching env vars on
# zetora.app — the app falls back to its defaults (Cloudflare R2, no vector
# cache, Tavily search, Daytona sandbox, no knowledge graph, QStash).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DB Migration (runs Drizzle migrations + creates performance indexes)
  # Exits cleanly after completion; zetora.app waits for it before starting.
  # ---------------------------------------------------------------------------
  db-migrate:
    image: registry.example.com/kcangiolu/zetora-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: zetora-db-migrate
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/zetora
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: 'no'

  zetora.app:
    image: registry.example.com/kcangiolu/zetora-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # DATABASE_URL/BETTER_AUTH_SECRET are intentionally NOT passed here —
        # the Dockerfile's build-only placeholders satisfy env/server.ts
        # validation without baking real secrets into image layers.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MCP_ENABLED: ${NEXT_PUBLIC_MCP_ENABLED:-false}
        NEXT_PUBLIC_CANVAS_ENABLED: ${NEXT_PUBLIC_CANVAS_ENABLED:-false}
        NEXT_PUBLIC_MCP_SANDBOX_ORIGIN: ${NEXT_PUBLIC_MCP_SANDBOX_ORIGIN:-}
        NEXT_PUBLIC_VOICE_BACKEND_URL: ${NEXT_PUBLIC_VOICE_BACKEND_URL:-}
        # STARTER/PREMIUM/MAX tier+slug feed Polar/Dodo checkout plugins that
        # throw at module-load if empty — default to "placeholder" so the
        # build succeeds even when payments aren't configured. Set the real
        # product IDs/slugs in .env to enable Polar/Dodo checkout.
        NEXT_PUBLIC_STARTER_TIER: ${NEXT_PUBLIC_STARTER_TIER:-placeholder}
        NEXT_PUBLIC_STARTER_SLUG: ${NEXT_PUBLIC_STARTER_SLUG:-placeholder}
        NEXT_PUBLIC_PREMIUM_TIER: ${NEXT_PUBLIC_PREMIUM_TIER:-placeholder}
        NEXT_PUBLIC_PREMIUM_SLUG: ${NEXT_PUBLIC_PREMIUM_SLUG:-placeholder}
        NEXT_PUBLIC_MAX_TIER: ${NEXT_PUBLIC_MAX_TIER:-placeholder}
        NEXT_PUBLIC_MAX_SLUG: ${NEXT_PUBLIC_MAX_SLUG:-placeholder}
    container_name: zetora-app
    ports:
      - '3333:3333'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOSTNAME=0.0.0.0
      # --- Internal service URLs (fixed by this compose's network topology;
      #     do NOT set these in .env, they would be overridden anyway) ---
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/zetora
      - REDIS_URL=redis://redis:6379
      - STORAGE_PROVIDER=minio
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET_NAME=zetora-uploads
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - QDRANT_URL=http://qdrant:6333
      - SEARXNG_URL=http://searxng:8080
      - FASTCRW_URL=http://fastcrw:3000
      - SANDBOX_PROVIDER=docker
      - DOCKER_SANDBOX_URL=http://sandbox:8000
      - GRAPHITI_API_URL=http://graphiti-api:8001
      - BULLMQ_ENABLED=true
      - BULLMQ_REDIS_URL=redis://bullmq-redis:6381
      - BULLMQ_REDIS_PASSWORD=${BULLMQ_REDIS_PASSWORD:-}
      - UPSTASH_REDIS_REST_URL=http://srh:80
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      # Public WS URL of s2s-service (local voice backend) the browser
      # connects to directly — set to your host's reachable address, e.g.
      # ws://<host>:8100/v1/realtime. Left unset, local voice stays unusable
      # (falls back to a localhost default that only resolves on the host).
      - VOICE_S2S_URL=${VOICE_S2S_URL:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bullmq-redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      searxng:
        condition: service_healthy
      fastcrw:
        condition: service_started
      sandbox:
        condition: service_started
      graphiti-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3333').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: zetora-postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=zetora
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (app cache / sessions / rate limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: zetora-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Serverless Redis HTTP (self-hosted Upstash REST API, backed by `redis`)
  # — used by @upstash/redis for rate limiting, x-wrapped cache, MCP elicitation
  # ---------------------------------------------------------------------------
  srh:
    image: hiett/serverless-redis-http:latest
    container_name: zetora-srh
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - SRH_CONNECTION_STRING=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible file storage — STORAGE_PROVIDER=minio)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: zetora-minio
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - ${DATA_DIR}/minio:/data:rw
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    command: server /data --console-address ":9001"
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:latest
    container_name: zetora-minio-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set zetora http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb zetora/zetora-uploads --ignore-existing;
      /usr/bin/mc anonymous set public zetora/zetora-uploads;
      exit 0;
      "
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: 'no'

  # ---------------------------------------------------------------------------
  # Qdrant (vector cache for search / hybrid search)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: zetora-qdrant
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - ${DATA_DIR}/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SearXNG (self-hosted metasearch engine)
  # ---------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: zetora-searxng
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ${DATA_DIR}/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_VALKEY_URL=redis://searxng-redis:6379/0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      searxng-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  searxng-redis:
    image: redis:alpine
    container_name: zetora-searxng-redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # fastCRW (self-hosted web scraper & search — Firecrawl alternative)
  # Single Rust binary, ~50 MB RAM, Firecrawl-compatible API
  # /v1/scrape — content extraction
  # /v1/search — web search via the internal SearXNG
  # ---------------------------------------------------------------------------
  fastcrw:
    image: ghcr.io/us/crw:latest
    container_name: zetora-fastcrw
    # The image serves its HTTP API on port 3000 and ignores CRW_PORT, so map
    # the host port to 3000 and point FASTCRW_URL at :3000 (see zetora.app).
    ports:
      - '127.0.0.1:3003:3000'
    environment:
      - CRW_NO_AUTH=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Sandbox (Code Interpreter tool — SANDBOX_PROVIDER=docker)
  # Requires access to the host's Docker socket.
  # ---------------------------------------------------------------------------
  sandbox:
    image: onyxdotapp/code-interpreter
    container_name: zetora-sandbox
    user: root
    ports:
      - '127.0.0.1:8003:8000' # port 8000 is hardcoded in the image, not configurable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MAX_EXEC_TIMEOUT_MS=30000
      - CPU_TIME_LIMIT_SEC=10
      - MEMORY_LIMIT_MB=256
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Graphiti (knowledge graph memory)
  # ---------------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    container_name: zetora-falkordb
    ports:
      - '127.0.0.1:6380:6379'
      - '127.0.0.1:3002:3002'
    volumes:
      - ${DATA_DIR}/falkordb:/data
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  graphiti-api:
    image: registry.example.com/kcangiolu/zetora-graphiti-api:latest
    build:
      context: ./graphiti-service
      dockerfile: Dockerfile
    container_name: zetora-graphiti-api
    ports:
      - '127.0.0.1:8001:8001'
    volumes:
      - ${DATA_DIR}/graphiti:/data
    environment:
      - PORT=8001
      - GRAPH_DB_URL=bolt://falkordb:6379
      - LLM_MODEL=${GRAPHITI_LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${GRAPHITI_LLM_API_KEY}
      - LLM_BASE_URL=${GRAPHITI_LLM_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_MODEL=${GRAPHITI_EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_API_KEY=${GRAPHITI_EMBEDDING_API_KEY}
      - EMBEDDING_BASE_URL=${GRAPHITI_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      - falkordb
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Anonymizer (PII detection for the activatable anonymization layer)
  # ---------------------------------------------------------------------------
  presidio-api:
    image: registry.example.com/kcangiolu/zetora-presidio-api:latest
    build:
      context: ./presidio-service
      dockerfile: Dockerfile
    container_name: zetora-presidio-api
    ports:
      - '127.0.0.1:8002:8000'
    environment:
      - PORT=8000
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    restart: unless-stopped

  graphiti-mcp:
    image: registry.example.com/kcangiolu/zetora-graphiti-mcp:latest
    build:
      context: ./graphiti-service
      dockerfile: Dockerfile.mcp
    container_name: zetora-graphiti-mcp
    ports:
      - '127.0.0.1:8002:8002'
    volumes:
      - ${DATA_DIR}/graphiti:/data
    environment:
      - PORT=8002
      - GRAPH_DB_URL=bolt://falkordb:6379
      - LLM_MODEL=${GRAPHITI_LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${GRAPHITI_LLM_API_KEY}
      - LLM_BASE_URL=${GRAPHITI_LLM_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_MODEL=${GRAPHITI_EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_API_KEY=${GRAPHITI_EMBEDDING_API_KEY}
      - EMBEDDING_BASE_URL=${GRAPHITI_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      - falkordb
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # BullMQ (self-hosted Lookouts scheduling)
  # ---------------------------------------------------------------------------
  bullmq-redis:
    image: redis:7-alpine
    container_name: zetora-bullmq-redis
    ports:
      - '127.0.0.1:6381:6381'
    entrypoint: >
      /bin/sh -c "
      if [ -n '${BULLMQ_REDIS_PASSWORD:-}' ]; then
      exec redis-server --port 6381 --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --requirepass '${BULLMQ_REDIS_PASSWORD:-}';
      else
      exec redis-server --port 6381 --maxmemory-policy noeviction --appendonly yes --appendfsync everysec;
      fi
      "
    volumes:
      - ${DATA_DIR}/bullmq-redis:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "redis-cli -p 6381 $$( [ -n '${BULLMQ_REDIS_PASSWORD:-}' ] && echo -a '${BULLMQ_REDIS_PASSWORD:-}' ) ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  bullboard:
    image: nauverse/bull-board:latest
    container_name: zetora-bullboard
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      - PORT=3001
      - REDIS_HOST=bullmq-redis
      - REDIS_PORT=6381
      - REDIS_PASSWORD=${BULLMQ_REDIS_PASSWORD:-}
      - BULL_PREFIX=bull
    depends_on:
      bullmq-redis:
        condition: service_healthy
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qwen3 TTS (text-to-speech, NVIDIA GPU required)
  # ---------------------------------------------------------------------------
  qwen3-tts:
    # Opt-in: not started by a plain `docker compose up -d`. It shares the
    # GPU with llama.cpp, so keeping it resident starves the LLM of VRAM and
    # tanks decode speed. Start on demand with:
    #   docker compose --profile tts up -d qwen3-tts
    # Or set COMPOSE_PROFILES=tts in .env to keep it resident like before.
    profiles: ['tts']
    image: registry.example.com/kcangiolu/zetora-tts:latest
    build:
      context: ./tts-service
      dockerfile: Dockerfile
      args:
        CUDA_IMAGE: ${TTS_CUDA_IMAGE:-nvidia/cuda:13.1.2-runtime-ubuntu24.04}
        TORCH_CUDA_BUILD: ${TTS_TORCH_CUDA_BUILD:-cu130}
        TORCH_VERSION: ${TTS_TORCH_VERSION:-2.9.1}
        # flash-attn: prebuilt (default, covers RTX 3090 + 5060 Ti) | compile | none.
        # 'compile' also needs TTS_CUDA_IMAGE set to a -devel image (for nvcc).
        FLASH_ATTN_MODE: ${TTS_FLASH_ATTN_MODE:-prebuilt}
        FLASH_ATTN_ARCH_LIST: ${TTS_FLASH_ATTN_ARCH_LIST:-8.0;8.6;8.9;9.0;10.0;12.0}
    container_name: zetora-qwen3-tts
    runtime: nvidia
    ports:
      - '127.0.0.1:8585:8080'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/data/huggingface
      - MODEL_ID=Qwen/Qwen3-TTS-12Hz-1.7B-Base
      - VOICES_DIR=/data/voices
      - LANG_CODE=french
      - PROMPT_CACHE_DIR=/data/prompt_cache
      - SAVE_OUTPUT=false
      - OUTPUT_DIR=/data/output
    volumes:
      - ${DATA_DIR}/qwen3-tts/huggingface:/data/huggingface
      - ${DATA_DIR}/qwen3-tts/output:/data/output
      - ${DATA_DIR}/qwen3-tts/voices:/data/voices:ro
      - ${DATA_DIR}/qwen3-tts/prompt_cache:/data/prompt_cache
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 7200s
    networks:
      - zetora-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Whisper STT (speech-to-text, OpenAI-compatible API)
  # /v1/audio/transcriptions — transcription
  # /v1/audio/translations   — translation
  # ---------------------------------------------------------------------------
  whisper-stt:
    # GPU build: shares the GPU with llama.cpp/qwen3-tts, but a transcription
    # only holds it briefly per utterance (~1-2GB VRAM for medium), unlike TTS
    # which stays resident — same runtime/env pattern as qwen3-tts below.
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: zetora-whisper-stt
    runtime: nvidia
    ports:
      - '127.0.0.1:9002:8000'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WHISPER__MODEL=medium
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16
    volumes:
      - ${DATA_DIR}/whisper:/root/.cache/huggingface
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Local speech-to-speech backend for the Voice page (alternative to the
  # cloud/xAI Realtime backend). CPU-only: Silero VAD is the only model that
  # runs here — STT/LLM/TTS are resolved by the app itself via callbacks to
  # /api/transcribe, /api/v1/chat/completions and /api/tts/stream. See
  # s2s-service/server.py and the voice s2s plan for the full design.
  # ---------------------------------------------------------------------------
  s2s-service:
    image: registry.example.com/kcangiolu/zetora-s2s:latest
    build:
      context: ./s2s-service
      dockerfile: Dockerfile
    container_name: zetora-s2s
    ports:
      - '127.0.0.1:8100:8080'
    environment:
      - APP_URL=http://zetora-app:3333
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

networks:
  zetora-network:
    name: zetora-network
