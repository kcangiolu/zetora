# =============================================================================
# Zetora — Production docker-compose
#
# Pull-only, on purpose: no service here has a `build:` section. Custom
# images (zetora-app, zetora-migrate, presidio-api, zetora-tts,
# stt-service, s2s-service, hermes-relay) are referenced via
# ${ZETORA_*_IMAGE} vars with a generic `:local` fallback — this file alone
# doesn't point at any specific registry. A deployment with its own registry
# supplies the real tags from a host-resident override file that is not
# tracked here (scripts/deploy-server-prod.sh uses docker-compose.internal.yml):
#   docker compose -f docker-compose.yml -f docker-compose.internal.yml pull/up
# A prod host that only has this compose file deployed (e.g. Unraid's
# Compose Manager) doesn't have the source subdirectories
# (./s2s-service, ./presidio-service, ...) that a `build:` context would
# need — always `docker compose pull` before `up -d` so Compose never falls
# back to trying to build one locally. Without a registry, build the `:local`
# images from source with docker-compose.build.yml (see its header).
#
# Usage:
#   1. Copy .env.example to .env and fill in the required values.
#   2. Set DATA_DIR in .env (e.g. DATA_DIR=/mnt/user/appdata/zetora).
#   3. Create the required directories and files on the host:
#
#        source .env
#        mkdir -p \
#          ${DATA_DIR}/postgres \
#          ${DATA_DIR}/redis \
#          ${DATA_DIR}/bullmq-redis \
#          ${DATA_DIR}/qdrant \
#          ${DATA_DIR}/minio \
#          ${DATA_DIR}/searxng \
#          ${DATA_DIR}/whisper \
#          ${DATA_DIR}/fastcrw \
#          ${DATA_DIR}/fastcrw-app \
#          ${DATA_DIR}/qwen3-tts/huggingface \
#          ${DATA_DIR}/qwen3-tts/output \
#          ${DATA_DIR}/qwen3-tts/voices \
#          ${DATA_DIR}/qwen3-tts/prompt_cache
#        # Copy the SearXNG config into ${DATA_DIR}/searxng/settings.yml
#        # Optional: drop {voice}.wav + {voice}.lang into qwen3-tts/voices/
#
#   4. docker compose pull && docker compose up -d
#      (or, building from source: docker compose -f docker-compose.yml
#       -f docker-compose.build.yml up -d --build)
#      By default this starts only the services Zetora actually needs to
#      boot — Postgres, Redis, BullMQ Redis, and zetora.app itself. Every
#      other bundled service is a self-hosted ALTERNATIVE to a cloud
#      provider the app already defaults to, gated behind its own profile,
#      and off unless you opt in:
#
#        profile      service(s)                        cloud alternative instead
#        ----------   -------------------------------    ----------------------
#        minio        minio, minio-create-bucket          any S3 service (S3_* in .env)
#        searxng      searxng, searxng-redis               Exa / Firecrawl
#        fastcrw      fastcrw, chrome                      Exa / Firecrawl
#        sandbox      sandbox                              Daytona (SANDBOX_PROVIDER)
#        bullmq       bullmq-redis, bullboard              Upstash QStash (LOOKOUT_SCHEDULER)
#        qdrant       qdrant                                (hybrid search just skipped)
#        presidio     presidio-api                          (anonymization stays off)
#        tts          qwen3-tts                             (no cloud equivalent; GPU-bound)
#
#      Storage, code execution and Lookout scheduling are chosen in .env
#      (S3_*, SANDBOX_PROVIDER, LOOKOUT_SCHEDULER), with no default: left
#      unset, the feature fails with an error naming what to set. Web search
#      falls back to its cloud providers on its own (see README's "All-Cloud
#      Configuration" section, and each service's own comment below).
#
#      Start any subset with:
#        docker compose --profile minio --profile searxng up -d
#      Or set COMPOSE_PROFILES to a comma-separated list in .env to keep a
#      chosen set always resident. Full self-hosted stack:
#        docker compose --profile minio --profile searxng --profile fastcrw \
#          --profile sandbox --profile bullmq --profile qdrant \
#          --profile presidio --profile tts up -d
#
# All services share the `zetora-network` network and resolve each other by
# service name (e.g. the app reaches Postgres at `postgres:5432`).
#
# Internal-only services (postgres, redis, minio, qdrant, searxng, sandbox,
# bullmq-redis, bullboard) are bound to 127.0.0.1 — put a
# reverse proxy in front of zetora.app (port 3333) for your domain, and use
# an SSH tunnel if you need direct access to an admin UI (MinIO console,
# Bullboard, SearXNG, Qdrant dashboard).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DB Migration (runs Drizzle migrations + creates performance indexes)
  # Exits cleanly after completion; zetora.app waits for it before starting.
  # ---------------------------------------------------------------------------
  db-migrate:
    image: ${ZETORA_MIGRATE_IMAGE:-zetora-migrate:local}
    container_name: zetora-db-migrate
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/zetora
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: 'no'

  zetora.app:
    # Pulled from the registry only — this file has no `build:` sections on
    # purpose (see the header comment). Images are built by
    # .gitea/workflows/docker.yml, or locally by docker-compose.build.yml;
    # both pass the NEXT_PUBLIC_* build-args.
    image: ${ZETORA_APP_IMAGE:-zetora-app:local}
    container_name: zetora-app
    ports:
      # NOT loopback-restricted, same reasoning as minio/s2s-service above:
      # some reverse-proxy topologies run on a different host. If yours runs
      # on this same host, change this to '127.0.0.1:3333:3333' — and either
      # way, do NOT set TRUSTED_PROXY=true (see .env.example) unless you've
      # confirmed every request genuinely passes through that proxy first;
      # otherwise a client reaching this port directly can spoof its rate
      # limit identity.
      - '3333:3333'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOSTNAME=0.0.0.0
      # --- Internal service URLs (fixed by this compose's network topology;
      #     do NOT set these in .env, they would be overridden anyway) ---
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/zetora
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - SEARXNG_URL=http://searxng:8080
      - FASTCRW_URL=http://fastcrw:3000
      - DOCKER_SANDBOX_URL=http://sandbox:8000
      - ANONYMIZER_API_URL=http://presidio-api:8000
      - S2S_SERVICE_URL=http://s2s-service:8080
      - BULLMQ_REDIS_URL=redis://bullmq-redis:6381
      - BULLMQ_REDIS_PASSWORD=${BULLMQ_REDIS_PASSWORD:-}
      # Public WS URL of s2s-service (local voice backend) the browser
      # connects to directly — set to your host's reachable address, e.g.
      # ws://<host>:8100/v1/realtime. Left unset, local voice stays unusable
      # (falls back to a localhost default that only resolves on the host).
      - VOICE_S2S_URL=${VOICE_S2S_URL:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3333').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: zetora-postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=zetora
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (app cache / sessions / rate limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: zetora-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Silo (S3-compatible file storage — point S3_* in .env at it)
  # ---------------------------------------------------------------------------
  # Runs Silo (github.com/pgsty/silo), the maintained community fork: MinIO
  # archived its open-source edition and deleted its images from Docker Hub and
  # quay.io. Same S3 API, MINIO_* variables and on-disk format, so existing data
  # is used as is. Pinned rather than :latest — upgrade by reading the release
  # notes first.
  minio:
    profiles: ['minio']
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: zetora-minio
    ports:
      # API port is NOT loopback-restricted like the other internal
      # services: generated files are served straight from S3_PUBLIC_URL to
      # the browser (no app-side proxy, see lib/generated-file-storage.ts),
      # so it has to be reachable from wherever your reverse proxy runs.
      # Front it with TLS there — this container has no TLS of its own.
      # Console (9001, full admin credentials) stays loopback-only.
      - '9010:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - ${DATA_DIR}/minio:/data:rw
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      # Public host presigned PUT URLs are signed against (S3_PRESIGN_ENDPOINT
      # below) — MinIO validates SigV4 signatures against this URL, so it must
      # match exactly (scheme + host, no path prefix) or every presigned
      # request 403s with SignatureDoesNotMatch.
      - MINIO_SERVER_URL=${MINIO_SERVER_URL:-}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  minio-create-bucket:
    profiles: ['minio']
    # The server image ships /usr/bin/mc, so bucket setup needs no separate client image.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: zetora-minio-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set zetora http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb zetora/zetora-uploads --ignore-existing;
      /usr/bin/mc anonymous set public zetora/zetora-uploads;
      printf '%s' '{\"CORSRules\":[{\"AllowedOrigin\":[\"${ALLOWED_ORIGINS:-https://your-domain.example}\"],\"AllowedMethod\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeader\":[\"*\"]}]}' > /tmp/cors.json;
      /usr/bin/mc cors set zetora/zetora-uploads /tmp/cors.json || true;
      exit 0;
      "
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: 'no'

  # ---------------------------------------------------------------------------
  # Qdrant (vector cache for search / hybrid search)
  # ---------------------------------------------------------------------------
  qdrant:
    profiles: ['qdrant']
    image: qdrant/qdrant:latest
    container_name: zetora-qdrant
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - ${DATA_DIR}/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      # No curl/wget in this image — a bare TCP connect confirms Qdrant is
      # accepting connections, which is all `depends_on` needs.
      test: ['CMD', 'bash', '-c', 'cat < /dev/null > /dev/tcp/127.0.0.1/6333']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SearXNG (self-hosted metasearch engine)
  # ---------------------------------------------------------------------------
  searxng:
    profiles: ['searxng']
    image: searxng/searxng:latest
    container_name: zetora-searxng
    ports:
      # Host port 8080 is taken by another stack on this box (immich) — the
      # container still listens on 8080, only the host side moves.
      - '127.0.0.1:8090:8080'
    volumes:
      - ${DATA_DIR}/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_VALKEY_URL=redis://searxng-redis:6379/0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      searxng-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  searxng-redis:
    profiles: ['searxng']
    image: redis:alpine
    container_name: zetora-searxng-redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # fastCRW (self-hosted web scraper & search — Firecrawl alternative)
  # Single Rust binary, ~50 MB RAM, Firecrawl-compatible API
  # /v1/scrape — content extraction
  # /v1/search — web search via the internal SearXNG
  #
  # JS rendering: crw-server's baked-in config points its LightPanda renderer
  # at loopback:9222 but never installs LightPanda itself — the `crw-server
  # setup` step that downloads it has to run at least once, and needs
  # somewhere writable to put it. `command` below runs setup (idempotent,
  # tolerated if it fails) then execs the server; the rest of the image stays
  # read-only. `chrome` is the vendor-recommended second-tier fallback for
  # pages that crash LightPanda's JS engine (heavy SPA hydration).
  # ---------------------------------------------------------------------------
  fastcrw:
    profiles: ['fastcrw']
    image: ghcr.io/us/crw:latest
    container_name: zetora-fastcrw
    # The image serves its HTTP API on port 3000 and ignores CRW_PORT, so map
    # the host port to 3000 and point FASTCRW_URL at :3000 (see zetora.app).
    ports:
      # Host port 3003 is taken by another stack on this box (Gitea) — the
      # container still listens on 3000, only the host side moves.
      - '127.0.0.1:3004:3000'
    # Chrome's DevTools handler rejects CDP requests whose Host header isn't
    # "localhost" or a literal IP (DNS-rebinding protection) — the compose
    # service name "chrome" gets a 403, so resolve it to its container IP at
    # boot instead of hardcoding one (container IPs aren't stable across
    # recreates on the default bridge network).
    #
    # `crw-server setup` only installs the LightPanda binary and writes a
    # config.local.toml pinning renderer.mode to "lightpanda" alone (dropping
    # chrome from the ladder) — override mode back to "auto" via env. It also
    # doesn't start LightPanda itself ("Start the server with JS rendering:
    # lightpanda serve ... & crw-server" is printed, not run), so spawn it as
    # a background subprocess before exec'ing crw-server.
    command: >
      sh -c "
      crw-server setup || true;
      export CRW_RENDERER__MODE=auto;
      export CRW_RENDERER__CHROME__WS_URL=\"ws://$$(getent hosts chrome | awk '{print $$1}'):9222/\";
      /root/.local/bin/lightpanda serve --host 127.0.0.1 --port 9222 &
      exec crw-server
      "
    volumes:
      # `setup` installs the LightPanda binary under $HOME/.local/bin
      # (HOME=/root) — mount the whole home dir rather than guessing at one
      # subpath.
      - ${DATA_DIR}/fastcrw:/root
      # `setup` also writes config.local.toml into its CWD (/app), regardless
      # of CRW_USER_CONFIG_DIR. /app is otherwise part of the read-only image
      # layer, so this volume is pre-seeded (once, by hand) with copies of
      # the image's own config.default.toml/config.docker.toml to avoid
      # shadowing them — see the fastcrw section of the deployment plan for
      # how it was populated.
      - ${DATA_DIR}/fastcrw-app:/app
    environment:
      - CRW_NO_AUTH=true
      # Without this, /v1/search always returns {"success":false,"errorCode":"search_disabled"} —
      # fastCRW proxies search to a SearXNG instance rather than implementing it itself.
      - CRW_SEARCH__SEARXNG_URL=http://searxng:8080
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    healthcheck:
      # No curl/wget in this image either — TCP connect on the API port.
      test: ['CMD', 'bash', '-c', 'cat < /dev/null > /dev/tcp/127.0.0.1/3000']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      chrome:
        condition: service_healthy
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Headless Chrome (CDP fallback renderer for fastCRW — see above)
  # Vanilla CDP on 9222, no wrapper API; internal-only, no host port.
  # ---------------------------------------------------------------------------
  chrome:
    profiles: ['fastcrw']
    # Image's own entrypoint already runs headless-shell with --no-sandbox on
    # a loopback-only debugging port, bridged to 0.0.0.0:9222 via socat — do
    # not pass --remote-debugging-port ourselves, it overrides the internal
    # port the entrypoint's own socat bridge forwards to and breaks it.
    image: chromedp/headless-shell:latest
    container_name: zetora-chrome
    tmpfs:
      - /tmp
      - /root/.cache
      - /root/.config
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ['CMD', 'bash', '-c', 'cat < /dev/null > /dev/tcp/127.0.0.1/9222']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Sandbox (Code Interpreter tool — SANDBOX_PROVIDER=docker)
  # Requires access to the host's Docker socket.
  # ---------------------------------------------------------------------------
  sandbox:
    profiles: ['sandbox']
    image: onyxdotapp/code-interpreter
    container_name: zetora-sandbox
    user: root
    ports:
      - '127.0.0.1:8003:8000' # port 8000 is hardcoded in the image, not configurable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MAX_EXEC_TIMEOUT_MS=30000
      - CPU_TIME_LIMIT_SEC=10
      - MEMORY_LIMIT_MB=256
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Anonymizer (PII detection for the activatable anonymization layer)
  # ---------------------------------------------------------------------------
  presidio-api:
    profiles: ['presidio']
    image: ${ZETORA_PRESIDIO_API_IMAGE:-zetora-presidio-api:local}
    container_name: zetora-presidio-api
    ports:
      - '127.0.0.1:8004:8000'
    environment:
      - PORT=8000
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          # 1G OOM-killed this on every start: it loads both en_core_web_lg
          # and fr_core_news_lg (spaCy's large models, ~550MB each on disk)
          # into memory at once during startup, well before it ever answers
          # a health check — the container never got a chance to be "slow",
          # it was killed outright.
          #
          # cpus was 1 until 2026-07-26: /detect used to run analyze()
          # straight on uvicorn's single event loop (fully serialized), so
          # extra cores did nothing. Now that main.py offloads it to a
          # thread pool, concurrent requests can actually use more than one
          # core — bumped to match the pool size (see _analyze_pool in
          # presidio-service/main.py).
          cpus: '4'
          memory: 3G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # BullMQ (self-hosted Lookouts scheduling)
  # ---------------------------------------------------------------------------
  bullmq-redis:
    profiles: ['bullmq']
    image: redis:7-alpine
    container_name: zetora-bullmq-redis
    ports:
      - '127.0.0.1:6381:6381'
    entrypoint: >
      /bin/sh -c "
      if [ -n '${BULLMQ_REDIS_PASSWORD:-}' ]; then
      exec redis-server --port 6381 --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --requirepass '${BULLMQ_REDIS_PASSWORD:-}';
      else
      exec redis-server --port 6381 --maxmemory-policy noeviction --appendonly yes --appendfsync everysec;
      fi
      "
    volumes:
      - ${DATA_DIR}/bullmq-redis:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "redis-cli -p 6381 $$( [ -n '${BULLMQ_REDIS_PASSWORD:-}' ] && echo -a '${BULLMQ_REDIS_PASSWORD:-}' ) ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  bullboard:
    profiles: ['bullmq']
    image: nauverse/bull-board:latest
    container_name: zetora-bullboard
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      - PORT=3001
      - REDIS_HOST=bullmq-redis
      - REDIS_PORT=6381
      - REDIS_PASSWORD=${BULLMQ_REDIS_PASSWORD:-}
      - BULL_PREFIX=bull
    depends_on:
      bullmq-redis:
        condition: service_healthy
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qwen3 TTS (text-to-speech, NVIDIA GPU required)
  # ---------------------------------------------------------------------------
  qwen3-tts:
    # Opt-in: not started by a plain `docker compose up -d`. It shares the
    # GPU with llama.cpp, so keeping it resident starves the LLM of VRAM and
    # tanks decode speed. Start on demand with:
    #   docker compose --profile tts up -d qwen3-tts
    # Or set COMPOSE_PROFILES=tts in .env to keep the container running.
    # The model itself still lazy-loads on first request and unloads after
    # 5min idle; set EAGER_LOAD=true below to load it at container start too.
    profiles: ['tts']
    image: ${ZETORA_TTS_IMAGE:-zetora-tts:local}
    container_name: zetora-qwen3-tts
    runtime: nvidia
    ports:
      - '8585:8080'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/data/huggingface
      - MODEL_ID=Qwen/Qwen3-TTS-12Hz-1.7B-Base
      - VOICES_DIR=/data/voices
      - LANG_CODE=french
      - PROMPT_CACHE_DIR=/data/prompt_cache
      - SAVE_OUTPUT=false
      - OUTPUT_DIR=/data/output
      - EAGER_LOAD=${TTS_EAGER_LOAD:-false}
      - DISABLE_IDLE_UNLOAD=${TTS_DISABLE_IDLE_UNLOAD:-false}
    volumes:
      - ${DATA_DIR}/qwen3-tts/huggingface:/data/huggingface
      - ${DATA_DIR}/qwen3-tts/output:/data/output
      - ${DATA_DIR}/qwen3-tts/voices:/data/voices:ro
      - ${DATA_DIR}/qwen3-tts/prompt_cache:/data/prompt_cache
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 7200s
    networks:
      - zetora-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # STT (speech-to-text, OpenAI-compatible /v1/audio/transcriptions)
  # NVIDIA Parakeet TDT 0.6B v3 via transformers — plain PyTorch, no NeMo
  # toolkit, no flash-attention, so unlike the previous Whisper/
  # faster-whisper-server setup it doesn't depend on a third-party
  # CTranslate2 build's CUDA-arch coverage: it reuses the exact torch/CUDA
  # wheels already verified working on both the RTX 3090 and RTX 5060 Ti for
  # qwen3-tts. Multilingual with automatic language detection (25 European
  # languages incl. French, ~5% WER) and smaller than Whisper medium.
  # The model itself lazy-loads on first request and unloads after 5min
  # idle; set EAGER_LOAD=true below to load it at container start instead.
  # ---------------------------------------------------------------------------
  stt-service:
    image: ${ZETORA_STT_IMAGE:-zetora-stt:local}
    container_name: zetora-stt
    runtime: nvidia
    ports:
      - '127.0.0.1:9002:8080'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - EAGER_LOAD=${STT_EAGER_LOAD:-false}
      - DISABLE_IDLE_UNLOAD=${STT_DISABLE_IDLE_UNLOAD:-false}
    volumes:
      # Legacy directory name from the previous whisper-stt service — it's
      # just the HF cache dir, no need to migrate an existing deployment.
      - ${DATA_DIR}/whisper:/root/.cache/huggingface
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Local speech-to-speech backend for the Voice page (alternative to the
  # cloud/xAI Realtime backend). CPU-only: Silero VAD is the only model that
  # runs here — STT/LLM/TTS are resolved by the app itself via callbacks to
  # /api/transcribe, /api/v1/chat/completions and /api/tts/stream. See
  # s2s-service/server.py and the voice s2s plan for the full design.
  # ---------------------------------------------------------------------------
  s2s-service:
    image: ${ZETORA_S2S_IMAGE:-zetora-s2s:local}
    container_name: zetora-s2s
    ports:
      # NOT loopback-restricted: the browser connects to this over
      # VOICE_S2S_URL through your reverse proxy (see docker-compose.yml's
      # own comment on that var), so the proxy has to be able to reach it.
      # If your proxy runs in its own container/host (e.g. SWAG on a LAN
      # IP), a loopback-only bind here 502s every /s2s/ request even though
      # curl from the Docker host itself works fine. Same class of bug as
      # MinIO's API port — see its comment below.
      - '8100:8080'
    environment:
      - APP_URL=http://zetora-app:3333
      # Read timeout (seconds) on the callbacks into the app, notably
      # /api/v1/chat/completions. The default (30s) is tuned for fast/cloud
      # models; a local LLM sharing your GPU (llama.cpp, etc.) can need more
      # headroom, especially on a tool-calling turn. Raise further if you
      # still see "Response generation failed:" with an empty message.
      - REQUEST_TIMEOUT_S=90
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Connector for Hermes Agent (github.com/NousResearch/hermes-agent)'s relay
  # protocol — lets any Zetora user connect their own, independently-run Hermes
  # gateway to their account. See hermes-relay-service/README.md for the
  # architecture rationale (why this is its own stateless service, holding no
  # DB credentials, rather than code inside zetora-app).
  #
  # Unlike every profile below this comment, `hermes` doesn't degrade to a
  # cloud equivalent when left off — it's a whole feature, gated end to end:
  # this container never starts, the zetora-app UI never shows it
  # (NEXT_PUBLIC_HERMES_ENABLED, a build-time flag — see .gitea/workflows/
  # docker.yml), and every /api/hermes*/internal/hermes* route 404s
  # regardless (lib/hermes/feature-flag.ts). Both flags default to ON, the
  # opposite of every other profile here: Hermes already ships to real
  # users, so leaving `hermes` out of COMPOSE_PROFILES on an EXISTING
  # deployment stops the running container — add it explicitly to keep
  # Hermes working, don't just omit it expecting a safe no-op.
  # ---------------------------------------------------------------------------
  hermes-relay-service:
    profiles: ['hermes']
    image: ${ZETORA_HERMES_RELAY_IMAGE:-zetora-hermes-relay:local}
    container_name: zetora-hermes-relay
    ports:
      # NOT loopback-restricted, same reasoning as minio/s2s-service above: this
      # is the endpoint users' own Hermes gateways dial into from anywhere, so a
      # reverse proxy in front of it (or this port directly) must be reachable
      # from outside the Docker host. Host side is 8201, not 8200: some hosts
      # already have something else bound to 8200 (e.g. a backup tool) — the
      # container's own internal port stays 8200, only the host publish differs,
      # so ZETORA_INTERNAL_URL/compose-network callers are unaffected. Override
      # via ${ZETORA_HERMES_RELAY_HOST_PORT} if 8201 collides too.
      - '${ZETORA_HERMES_RELAY_HOST_PORT:-8201}:8200'
    environment:
      - HERMES_RELAY_PORT=8200
      - ZETORA_INTERNAL_URL=http://zetora-app:3333
      - HERMES_RELAY_INTERNAL_SECRET=${HERMES_RELAY_INTERNAL_SECRET}
    # No depends_on: zetora.app, deliberately — matching every other sidecar
    # here (s2s-service etc.): local dev runs the app via `next dev` on the
    # host, not this container, so a hard startup dependency on it would break
    # local testing. A call to ZETORA_INTERNAL_URL before the app is reachable
    # just fails that one request; the gateway retries its own dial anyway.
    networks:
      - zetora-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

networks:
  zetora-network:
    name: zetora-network
