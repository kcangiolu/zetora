services:
  minio:
    image: minio/minio:latest
    container_name: zetora-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./minio-data:/data:rw
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
    command: server /data --console-address ":9001"
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:latest
    container_name: zetora-minio-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set zetora http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb zetora/zetora-uploads --ignore-existing;
      /usr/bin/mc anonymous set public zetora/zetora-uploads;
      exit 0;
      "
