services:
  sandbox:
    image: onyxdotapp/code-interpreter
    user: root
    ports:
      - '8000:8000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MAX_EXEC_TIMEOUT_MS=30000
      - CPU_TIME_LIMIT_SEC=10
      - MEMORY_LIMIT_MB=256
    restart: unless-stopped
